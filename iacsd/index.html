<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IACSD Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            text-align: center;
            padding: 80px 20px;
        }
        .card {
            max-width: 600px;
            margin: auto;
            padding: 40px 20px;
            background: rgba(255,255,255,0.12);
            border-radius: 20px;
        }
        a {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 28px;
            background: #00c9a7;
            color: #111;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
        }
        a:hover { background: #00f5c4; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Welcome to IACSD</h1>
        <p>Explore our learning and technology programs.</p>
        <p>Click below to visit the ITISS website.</p>
        <a href="/itiss/">Visit ITISS</a>
    </div>
</body>
</html>
