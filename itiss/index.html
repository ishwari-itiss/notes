
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITISS Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #42275a, #734b6d);
            color: white;
            text-align: center;
            padding: 80px 20px;
        }
        .card {
            max-width: 600px;
            margin: auto;
            padding: 40px 20px;
            background: rgba(255,255,255,0.12);
            border-radius: 20px;
        }
        a {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 28px;
            background: #ffd166;
            color: #222;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Welcome to ITISS</h1>
        <p>This website is running in a separate Docker container.</p>
        <a href="/">Back to IACSD</a>
    </div>
</body>
</html>
